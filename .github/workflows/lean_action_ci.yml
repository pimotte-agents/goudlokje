name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # Builds the package and runs `lake test` (the `Tests` library).
      - uses: leanprover/lean-action@v1
      - name: End-to-end tests
        run: e2e/run.sh
